<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Agila De Bayani</title>
        <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #9fc2da;
            color: #4e6068;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #634949;
            color: #f5f4f4;
            padding: 15px 20px 0 20px;
            text-align: center;
        }

        nav ul li a {
            transition: all 0.3s ease;
            cursor: pointer;
}
        nav ul li a:hover {   
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .image-group a {
            display: inline-block;
            transition: transform 0.3s ease;
}

.image-group a:hover {
    transform: scale(1.08);
}

.circular-img {
    cursor: pointer;
}

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #d10c0c;
            object-fit: cover;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav {
            background-color: #525050;
            margin: 0 -20px;
            padding: 10px 0 0 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 12px 10px 12px;
            display: inline-block;
            position: relative;
            cursor: pointer;
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .tab-content {
            display: none;
        }

        .tab-content .active {
            display: block;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        nav ul li a {
    transition: all 0.3s ease;
    cursor: pointer;
}

        nav ul li a:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
}

        .image-group a {
            display: inline-block;
            transition: transform 0.3s ease;
}

        .image-group a:hover {
            transform: scale(1.08);
}
        .circular-img {
            cursor: pointer;
}

        .card {
            background-color: #91def5;
            width: 100%;
            max-width: 720px;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #38423b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }



        .tagline {
            font-size: 0.9rem;
            font-style: italic;
            color: #627267;
            margin-bottom: 25px;
        }

        .image-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .circular-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3px solid #d1b15a;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
        }

        .description {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #4a574f;
            max-width: 580px;
            margin: 0 auto 25px auto;
        }

        .btn {
            display: inline-block;
            background-color: #555555;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #333333;
        }
        
        footer {
            background-color: #1a1a1a;
            color: #aaaaaa;
            text-align: center;
            padding: 15px 20px;
            font-size: 0.75rem;
            }
            
</style>
</head>
<script>
function switchTab(event, tabId) {
    if (event) {
        event.preventDefault();
    }
    const navBtns = document.querySelectorAll('.nav-btn');
    navBtns.forEach(btn => btn.classList.remove('active'));
    if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }
}
</script>
<body>


    <header>
        <div class="brand-header">
            <img src="Logo.png" alt="Logo" class="brand-logo">
            <span class="Agila De Bayani">AGILA DE BAYANI</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="gallery.html">GALLERY</a></li>
                <li><a href="contact.html"class="active">CONTACT</a></li>

            </ul>
        </nav>
    </header>
    
   

    <footer>
        <p>&copy; Agila De Bayani</p>
    </footer>

</body>
</html>
